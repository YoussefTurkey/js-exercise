<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">

  <div class="container mt-5">
    <h2 class="text-center mb-4">قائمة الأسماء</h2>

    <!-- Form -->
    <form id="contactForm" class="row g-3 bg-white p-4 shadow rounded">
      <div class="col-md-3">
        <input type="text" id="name" class="form-control" placeholder="الاسم" required>
      </div>
      <div class="col-md-3">
        <input type="tel" id="phone" class="form-control" placeholder="رقم الهاتف" required>
      </div>
      <div class="col-md-4">
        <input type="email" id="email" class="form-control" placeholder="البريد الإلكتروني" required>
      </div>
      <div class="col-md-2">
        <button type="submit" class="btn btn-success w-100">Add Contact</button>
      </div>
    </form>

    <!-- Table -->
    <div class="mt-4">
      <table class="table table-bordered text-center">
        <thead class="table-dark">
          <tr>
            <th>الاسم</th>
            <th>رقم الهاتف</th>
            <th>البريد الإلكتروني</th>
          </tr>
        </thead>
        <tbody id="contactsTable">
          <!-- الصفوف تضاف هنا -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
