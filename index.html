<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Counter App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">

  <div class="container mt-5 text-center">
    <h2 class="mb-4">🔢 تسبيحة</h2>

    <div class="card p-5 shadow-sm">
      <h1 id="counter" class="display-3 text-primary">0</h1>

      <div class="mt-4 d-flex justify-content-center gap-3">
        <button id="decreaseBtn" class="btn btn-danger fs-3 px-5">-</button>
        <button id="resetBtn" class="btn btn-warning px-4">🔁</button>
        <button id="increaseBtn" class="btn btn-success fs-3 px-5">+</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
