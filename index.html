<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grade Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">

  <div class="container mt-5">
    <h2 class="text-center mb-4">حاسبة درجات الطالب</h2>

    <!-- Form -->
    <form id="gradeForm" class="row g-3 shadow p-4 bg-white rounded">
      <div class="col-md-3">
        <input type="text" id="studentName" class="form-control" placeholder="اسم الطالب" required>
      </div>
      <div class="col-md-2">
        <input type="number" id="grade1" class="form-control" min="0" max="100" placeholder="درجة المادة 1" required>
      </div>
      <div class="col-md-2">
        <input type="number" id="grade2" class="form-control" min="0" max="100" placeholder="درجة المادة 2" required>
      </div>
      <div class="col-md-2">
        <input type="number" id="grade3" class="form-control" min="0" max="100" placeholder="درجة المادة 3" required>
      </div>
      <div class="col-md-3">
        <button type="submit" class="btn btn-primary w-100">احسب</button>
      </div>
    </form>

    <!-- Table -->
    <div class="mt-4">
      <table class="table table-bordered text-center">
        <thead class="table-dark">
          <tr>
            <th>اسم الطالب</th>
            <th>المجموع</th>
            <th>النسبة المئوية</th>
            <th>التقدير</th>
          </tr>
        </thead>
        <tbody id="resultTable">
          <!-- النتائج هتظهر هنا -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
