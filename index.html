<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Random Quote Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">

  <div class="container mt-5 text-center">
    <h2 class="mb-4">🎯 اقتباس جامدة زوحليقة</h2>

    <div class="card p-4 shadow-sm">
      <blockquote id="quoteText" class="fs-4 text-primary">اضغط على الزر لعرض اقتباس...</blockquote>
      <p id="quoteAuthor" class="text-muted fst-italic mt-2"></p>

      <button id="generateBtn" class="btn btn-success mt-4">اعرض اقتباس</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
