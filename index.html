<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BMI Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">

  <div class="container mt-5">
    <h2 class="text-center mb-4">حاسبة مؤشر كتلة الجسم (BMI)</h2>

    <!-- Form -->
    <div class="card p-4 shadow-sm">
      <div class="mb-3">
        <label for="weight" class="form-label">الوزن (كجم)</label>
        <input type="number" id="weight" class="form-control" placeholder="مثال: 70" required>
      </div>
      <div class="mb-3">
        <label for="height" class="form-label">الطول (سم)</label>
        <input type="number" id="height" class="form-control" placeholder="مثال: 170" required>
      </div>
      <button id="calculateBtn" class="btn btn-primary w-100">احسب</button>
    </div>

    <!-- Result -->
    <div id="result" class="mt-4 text-center fw-bold fs-5"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
